[project]
name = "refund-desk"
version = "0.1.0"
description = "Refund routing: fixed rules decide, an LLM reads the free text, people handle the rest."
requires-python = ">=3.11"
dependencies = ["google-genai>=1.33", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
refund-desk = "refund_desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
